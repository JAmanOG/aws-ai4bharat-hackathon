AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Rural Ecosystem Platform – Health Services Access
  Requirement 9: Symptom checking, medical imaging, govt health portals,
  provider directory, health knowledge base.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        AWS_REGION_CUSTOM: !Ref AWS::Region
        HEALTH_ARTICLES_TABLE: !Ref HealthArticlesTable
        SYMPTOM_LOGS_TABLE: !Ref SymptomLogsTable
        IMAGING_BUCKET: !Ref ImagingBucket
        PG_HOST: !GetAtt AuroraCluster.Endpoint.Address
        PG_PORT: '5432'
        PG_DATABASE: 'rural_health'
        PG_USER: 'admin'
        PG_SSL: 'true'
        BEDROCK_MODEL_ID: 'anthropic.claude-3-haiku-20240307-v1:0'
        METRIPORT_API_KEY: ''
        METRIPORT_BASE_URL: 'https://api.sandbox.metriport.com'

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  DBMasterPassword:
    Type: String
    NoEcho: true
    Default: 'ChangeMe123!'

Resources:
  # ═══════════════════════════════════════
  #  API Gateway
  # ═══════════════════════════════════════
  HealthApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'rural-health-api-${Stage}'
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-User-Id'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # ═══════════════════════════════════════
  #  Lambda — Health AI (Symptom Checker + Knowledge Base)
  # ═══════════════════════════════════════
  HealthAIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'health-ai-${Stage}'
      Handler: backend/lambdas/health-ai/index.handler
      Description: 'AI symptom checker and health knowledge base'
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HealthArticlesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SymptomLogsTable
        - Statement:
            - Effect: Allow
              Action: ['bedrock:InvokeModel']
              Resource: '*'
      Events:
        SymptomCheck:
          Type: Api
          Properties:
            Path: /api/v1/health/symptom-check
            Method: POST
            RestApiId: !Ref HealthApi
        ArticlesList:
          Type: Api
          Properties:
            Path: /api/v1/health/articles
            Method: GET
            RestApiId: !Ref HealthApi
        ArticleGenerate:
          Type: Api
          Properties:
            Path: /api/v1/health/articles/generate
            Method: POST
            RestApiId: !Ref HealthApi
        ArticleGet:
          Type: Api
          Properties:
            Path: /api/v1/health/articles/{id}
            Method: GET
            RestApiId: !Ref HealthApi

  # ═══════════════════════════════════════
  #  Lambda — Medical Imaging (Metriport)
  # ═══════════════════════════════════════
  MedicalImagingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'medical-imaging-${Stage}'
      Handler: backend/lambdas/medical-imaging/index.handler
      Description: 'Medical imaging upload and AI analysis via Metriport'
      Timeout: 60
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagingBucket
        - Statement:
            - Effect: Allow
              Action: ['bedrock:InvokeModel']
              Resource: '*'
      Events:
        ImagingUpload:
          Type: Api
          Properties:
            Path: /api/v1/health/imaging/upload
            Method: POST
            RestApiId: !Ref HealthApi
        ImagingGet:
          Type: Api
          Properties:
            Path: /api/v1/health/imaging/{id}
            Method: GET
            RestApiId: !Ref HealthApi
        ImagingAnalyze:
          Type: Api
          Properties:
            Path: /api/v1/health/imaging/{id}/analyze
            Method: POST
            RestApiId: !Ref HealthApi

  # ═══════════════════════════════════════
  #  Lambda — Health Directory (Portals + Providers)
  # ═══════════════════════════════════════
  HealthDirectoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'health-directory-${Stage}'
      Handler: backend/lambdas/health-directory/index.handler
      Description: 'Government health portals and private provider directory'
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['rds-data:*']
              Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}'
            - Effect: Allow
              Action: ['bedrock:InvokeModel']
              Resource: '*'
      Events:
        PortalsList:
          Type: Api
          Properties:
            Path: /api/v1/health/govt-portals
            Method: GET
            RestApiId: !Ref HealthApi
        PortalGet:
          Type: Api
          Properties:
            Path: /api/v1/health/govt-portals/{id}
            Method: GET
            RestApiId: !Ref HealthApi
        EligibilityCheck:
          Type: Api
          Properties:
            Path: /api/v1/health/eligibility-check
            Method: POST
            RestApiId: !Ref HealthApi
        ProvidersList:
          Type: Api
          Properties:
            Path: /api/v1/health/providers
            Method: GET
            RestApiId: !Ref HealthApi
        ProviderGet:
          Type: Api
          Properties:
            Path: /api/v1/health/providers/{id}
            Method: GET
            RestApiId: !Ref HealthApi

  # ═══════════════════════════════════════
  #  DynamoDB Tables
  # ═══════════════════════════════════════
  HealthArticlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'HealthArticles-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: articleId
          AttributeType: S
        - AttributeName: topic
          AttributeType: S
      KeySchema:
        - AttributeName: articleId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByTopic
          KeySchema:
            - AttributeName: topic
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SymptomLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'SymptomLogs-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: checkedAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: checkedAt
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ═══════════════════════════════════════
  #  S3 — Medical Imaging Upload
  # ═══════════════════════════════════════
  ImagingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'rural-health-imaging-${Stage}-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # ═══════════════════════════════════════
  #  Cognito + Aurora (same pattern as feature1/2)
  # ═══════════════════════════════════════
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'rural-health-users-${Stage}'
      AutoVerifiedAttributes: [phone_number]
      UsernameAttributes: [phone_number]
      MfaConfiguration: 'OFF'
      Schema:
        - Name: phone_number
          Required: true
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'rural-health-app-${Stage}'
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      GenerateSecret: false

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: !Sub 'rural-health-db-${Stage}'
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: '15.4'
      MasterUsername: admin
      MasterUserPassword: !Ref DBMasterPassword
      DatabaseName: rural_health
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 4
      StorageEncrypted: true

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql

Outputs:
  ApiUrl:
    Description: Health API URL
    Value: !Sub 'https://${HealthApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  UserPoolId:
    Value: !Ref CognitoUserPool
  ImagingBucketName:
    Value: !Ref ImagingBucket
  AuroraEndpoint:
    Value: !GetAtt AuroraCluster.Endpoint.Address
