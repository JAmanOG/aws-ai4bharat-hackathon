# Rural Ecosystem Platform – Development Stack
# ──────────────────────────────────────────────
# Two profiles:
#   docker compose up -d                    → uses AWS managed services (Aurora, DynamoDB)
#   docker compose --profile local up -d    → uses local Postgres + DynamoDB-local
#
# Start Expo dev server separately:
#   cd RuralAi && npx expo start

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      CORS_ORIGIN: "*"

      # ── Database ──
      # Default: Aurora Serverless v2 (set via .env or CI).
      # Override PG_HOST / PG_PASSWORD etc. in .env for your account.
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE:-rural_platform}
      PG_USER: ${PG_USER:-admin}
      PG_PASSWORD: ${PG_PASSWORD:-localdev123}
      PG_SSL: ${PG_SSL:-false}

      # ── DynamoDB ──
      # When DYNAMODB_ENDPOINT is empty the SDK auto-targets the real service.
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}

      # ── AI / Bedrock ──
      BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
      DIGILOCKER_USE_MOCK: "true"

      # ── SNS / SES ──
      PRICE_ALERT_SNS_TOPIC: ${PRICE_ALERT_SNS_TOPIC:-arn:aws:sns:ap-south-1:000000000000:PriceAlerts-dev}

      # ── DynamoDB table names ──
      FARMER_PROFILES_TABLE: FarmerProfiles-dev
      PRICE_ALERTS_TABLE: PriceAlerts-dev
      PRICE_WATCH_TABLE: PriceWatch-dev
      USER_LEARNING_PROFILE_TABLE: UserLearningProfile-dev
      PEER_GROUPS_TABLE: PeerGroups-dev
      LEARNING_RECOMMENDATIONS_TABLE: LearningRecommendations-dev
      CONTENT_INTERACTIONS_TABLE: ContentInteractions-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Local-only services (activate with --profile local) ──
  postgres:
    image: postgres:15-alpine
    profiles: ["local"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: rural_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rural_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    profiles: ["local"]
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

volumes:
  postgres_data:
